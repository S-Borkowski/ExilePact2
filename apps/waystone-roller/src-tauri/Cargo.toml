[package]
name = "waystone-roller"
description = "The waystone roller window: Tauri glue around wr-app."
version.workspace = true
edition.workspace = true
publish.workspace = true

# The library carries the glue; src/main.rs only calls `run`. The `_lib`
# suffix keeps the library's output name apart from the binary's.
[lib]
name = "waystone_roller_lib"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
wr-app = { path = "../crates/wr-app" }
# The app's only network code, shared with the quest tracker (apps/shared):
# the release list and the two fixed release assets, over WinHTTP. Named by
# this glue alone, which implements wr-app's update transport over it.
ep-net = { path = "../../shared/crates/ep-net" }
tauri = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# The clipboard writer and the error beep.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
