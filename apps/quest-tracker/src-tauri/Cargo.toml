[package]
name = "quest-tracker"
description = "The quest-tracker overlay: Tauri glue around qt-app."
version.workspace = true
edition.workspace = true
publish.workspace = true

# The library carries the glue; src/main.rs only calls `run`. The `_lib`
# suffix keeps the library's output name apart from the binary's.
[lib]
name = "quest_tracker_lib"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
qt-app = { path = "../crates/qt-app" }
# The update check's and the install's transport, shared with the waystone
# roller (apps/shared): the app's only network code, the release list and a
# release's two fixed assets, requested only when a check or an install runs.
ep-net = { path = "../../shared/crates/ep-net" }
tauri = { workspace = true }
tauri-plugin-global-shortcut = { workspace = true }
tauri-plugin-single-instance = { workspace = true }
tauri-plugin-opener = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }
# The screen reader's real backend (Win32 capture and Windows OCR).
qt-capture = { path = "../crates/qt-capture" }
