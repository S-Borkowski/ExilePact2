[package]
name = "ep-net"
description = "Both apps' only network code: the repository's GitHub release list and a fixed release asset, fetched over HTTPS through Windows' own WinHTTP."
version.workspace = true
edition.workspace = true
publish.workspace = true

# WinHTTP comes with the already-pinned `windows-sys`; the feature is added
# here so no other member compiles it. Elsewhere than Windows the crate has
# no dependency at all and every request is refused as unsupported.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Networking_WinHttp"] }
