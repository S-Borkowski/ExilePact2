# Any equipment, state-ordered: build a magic item with two good modifiers
# (transmute, clean, augment), let an essence add a third as it turns rare,
# then finish with side-restricted slams. Paraphrased from the guide
# `source` names; the rules are docs/models/crafting-slots-spec.md.
id = "magic-augment-essence"
name = "Magic with two good modifiers, then an essence"
classes = [
    "Gloves", "Boots", "Helmets", "Body Armours", "Shields", "Quivers",
    "Bucklers", "Foci", "Wands", "One Hand Maces", "Sceptres", "Spears",
    "Bows", "Staves", "Two Hand Maces", "Quarterstaves", "Crossbows",
    "Talismans", "Belts", "Amulets", "Rings",
]
source = "maxroll, How to Craft in Path of Exile 2, method 1 (https://maxroll.gg/poe2/resources/how-to-craft-in-path-of-exile-2), fetched 2026-10-29"
notes = """
The guide's first method: a magic item holds one prefix and one suffix, so \
two good modifiers are cheap to reach there with Orbs of Transmutation and \
Augmentation (Perfect first, for their high minimum modifier level), and a \
Lesser, plain or Greater essence then adds a third as it makes the item \
rare. A wrong modifier on the magic item is annulled, with the Sinistral \
or Dextral Annulment omen when the other side holds a target. On the rare \
item the rest come from Perfect Exalted Orbs restricted to their side, with \
Omen of Greater Exaltation where two free slots take two targets, after a \
removal when a side has too few free slots. The last target, once it is \
the only one missing on the rare item with no desecrated modifier, is \
desecrated on its side with Omen of Sinistral or Dextral Necromancy and \
revealed with Omen of Abyssal Echoes, both active before use, instead of \
slammed; a wrong reveal is taken off with Omen of Light and an Orb of \
Annulment and the bone used again. Where the class has no desecrated \
modifier on that side at the item's level, or the bone or the omen is \
blocked, it is slammed and the step says why. An augment lands on the \
magic item's free side when the other is full, a community reading the \
route relies on, like Greater Exaltation with a side omen (relies_on). The \
preview assumes every step hits."""
order = "state"
relies_on = [
    "greater-with-side-omen",
    "greater-needs-two-free",
    "open-side-landing",
    "whittling-mod-level",
    "fractured-not-removed",
    "omens-active-before-use",
]

[[start]]
rarity = ["normal"]

[[start]]
rarity = ["magic"]

[[step]]
id = "transmute"
say = "Transmute the normal item"
goal = "add-wanted"
guard = { rarity = ["normal"] }

[[step.action]]
currency = "perfect-orb-of-transmutation"

[[step.action]]
currency = "greater-orb-of-transmutation"

[[step.action]]
currency = "orb-of-transmutation"

# A magic item has one slot a side: a wrong modifier blocks it.
[[step]]
id = "remove-magic"
say = "Annul the wrong modifier (Sinistral or Dextral Annulment when the other side holds a target)"
goal = "remove-unwanted"
side = "blocked"
guard = { rarity = ["magic"] }

[[step.action]]
currency = "orb-of-annulment"
omens = ["side-omen"]

[[step.action]]
currency = "orb-of-annulment"

[[step]]
id = "augment"
say = "Augment the magic item's free slot"
goal = "add-wanted"
guard = { rarity = ["magic"] }

[[step.action]]
currency = "perfect-orb-of-augmentation"

[[step.action]]
currency = "greater-orb-of-augmentation"

[[step.action]]
currency = "orb-of-augmentation"

# Lesser, plain and Greater essences make a Magic item Rare with their
# modifier; per family the cheapest grade comes first, so the first one
# that meets the floor is the one offered.
[[step]]
id = "essence"
say = "Use the essence that adds a target"
goal = "add-wanted"
bind = "essence"
when = "bound"
guard = { rarity = ["magic"] }
action = [
    { currency = "lesser-essence-of-the-body" },
    { currency = "essence-of-the-body" },
    { currency = "greater-essence-of-the-body" },
    { currency = "lesser-essence-of-the-mind" },
    { currency = "essence-of-the-mind" },
    { currency = "greater-essence-of-the-mind" },
    { currency = "lesser-essence-of-enhancement" },
    { currency = "essence-of-enhancement" },
    { currency = "greater-essence-of-enhancement" },
    { currency = "lesser-essence-of-insulation" },
    { currency = "essence-of-insulation" },
    { currency = "greater-essence-of-insulation" },
    { currency = "lesser-essence-of-thawing" },
    { currency = "essence-of-thawing" },
    { currency = "greater-essence-of-thawing" },
    { currency = "lesser-essence-of-grounding" },
    { currency = "essence-of-grounding" },
    { currency = "greater-essence-of-grounding" },
    { currency = "lesser-essence-of-ruin" },
    { currency = "essence-of-ruin" },
    { currency = "greater-essence-of-ruin" },
    { currency = "lesser-essence-of-the-infinite" },
    { currency = "essence-of-the-infinite" },
    { currency = "greater-essence-of-the-infinite" },
    { currency = "lesser-essence-of-abrasion" },
    { currency = "essence-of-abrasion" },
    { currency = "greater-essence-of-abrasion" },
    { currency = "lesser-essence-of-flames" },
    { currency = "essence-of-flames" },
    { currency = "greater-essence-of-flames" },
    { currency = "lesser-essence-of-ice" },
    { currency = "essence-of-ice" },
    { currency = "greater-essence-of-ice" },
    { currency = "lesser-essence-of-electricity" },
    { currency = "essence-of-electricity" },
    { currency = "greater-essence-of-electricity" },
    { currency = "lesser-essence-of-battle" },
    { currency = "essence-of-battle" },
    { currency = "greater-essence-of-battle" },
    { currency = "lesser-essence-of-seeking" },
    { currency = "essence-of-seeking" },
    { currency = "greater-essence-of-seeking" },
    { currency = "lesser-essence-of-alacrity" },
    { currency = "essence-of-alacrity" },
    { currency = "greater-essence-of-alacrity" },
    { currency = "lesser-essence-of-haste" },
    { currency = "essence-of-haste" },
    { currency = "greater-essence-of-haste" },
    { currency = "lesser-essence-of-sorcery" },
    { currency = "essence-of-sorcery" },
    { currency = "greater-essence-of-sorcery" },
    { currency = "lesser-essence-of-command" },
    { currency = "essence-of-command" },
    { currency = "greater-essence-of-command" },
    { currency = "lesser-essence-of-opulence" },
    { currency = "essence-of-opulence" },
    { currency = "greater-essence-of-opulence" },
]

# The rare phase. The last target's desecration (docs/models/
# crafting-slots-spec.md, "The last-target desecration"): its unrevealed
# modifier is revealed before anything else touches the item.
[[step]]
id = "reveal-last"
say = "Reveal the last target's modifier; Abyssal Echoes rerolls the options"
goal = "reveal"
bind = "last-remaining"
when = "bound"

[[step.action]]
currency = "reveal"
omens = ["omen-of-abyssal-echoes"]

[[step.action]]
currency = "reveal"

# A reveal that offered no target: the wrong modifier goes, the bone again.
[[step]]
id = "light-last"
say = "Omen of Light with an Orb of Annulment: the wrong desecrated modifier goes"
goal = "remove-desecrated"
bind = "last-remaining"
when = "bound"
guard = { desecrated_unwanted = true }

[[step.action]]
currency = "orb-of-annulment"
omens = ["omen-of-light"]

[[step]]
id = "remove"
say = "Whittle the blocker when that is certain, else annul it (Sinistral or Dextral Annulment when the other side holds a target)"
goal = "remove-unwanted"
side = "blocked"
guard = { rarity = ["rare"] }

[[step.action]]
currency = "chaos-orb"
omens = ["omen-of-whittling"]

[[step.action]]
currency = "orb-of-annulment"
omens = ["side-omen"]

[[step.action]]
currency = "orb-of-annulment"

# One target left on a rare with no desecrated modifier: desecrate its side
# rather than slam. One alternative only: a bone without the side omen
# could land on the other side, so with the omen blocked the route slams.
[[step]]
id = "desecrate-last"
say = "Desecrate on the last target's side (Sinistral or Dextral Necromancy)"
goal = "desecrate"
side = "target"
bind = "last-remaining"
when = "bound"
guard = { rarity = ["rare"] }

[[step.action]]
currency = "desecrate"
omens = ["side-omen"]

[[step]]
id = "side-slam"
say = "Exalt for a target on its side (Sinistral or Dextral Exaltation)"
goal = "add-wanted"
side = "target"

[[step.action]]
currency = "perfect-exalted-orb"
omens = ["greater-omen", "side-omen"]

[[step.action]]
currency = "greater-exalted-orb"
omens = ["greater-omen", "side-omen"]

[[step.action]]
currency = "exalted-orb"
omens = ["greater-omen", "side-omen"]
