# Any equipment, state-ordered: when one side already holds all its targets,
# fill its free slots with anything so that the other side is the only one
# an Exalted Orb can land on, then slam that side. Paraphrased from the
# guides `source` names; the rules are docs/models/crafting-slots-spec.md.
id = "close-a-side"
name = "Close the finished side, then slam the open one"
classes = [
    "Gloves", "Boots", "Helmets", "Body Armours", "Shields", "Quivers",
    "Bucklers", "Foci", "Wands", "One Hand Maces", "Sceptres", "Spears",
    "Bows", "Staves", "Two Hand Maces", "Quarterstaves", "Crossbows",
    "Talismans", "Belts", "Amulets", "Rings",
]
source = "maxroll, How to Craft in Path of Exile 2, method 3 (https://maxroll.gg/poe2/resources/how-to-craft-in-path-of-exile-2) and the domistae PoE2 Crafting Codex (https://domistae.github.io/poe2-leveling/poe2_crafting_codex.html), fetched 2026-10-29"
notes = """
Both guides describe closing a side: once one side has every target it \
needs, its leftover slots are filled with cheap modifiers on purpose, so \
the side still missing a target is the only place an exalt can go. The \
fill is a plain Exalted Orb restricted to the finished side, two at a time \
with Omen of Greater Exaltation where two slots are free; the slam on the \
last open side then needs no side omen. A removal comes first when a side \
is full of modifiers that are not targets: a whittle only when it is \
certain to take a non-target, else an Orb of Annulment, confined to the \
blocked side when the other side holds a target. Greater Exaltation with a \
side omen, and an exalt landing on the open side when the other is full, \
are community readings, not GGG's; the route relies on them (relies_on). \
The preview assumes every step hits."""
order = "state"
relies_on = [
    "greater-with-side-omen",
    "greater-needs-two-free",
    "open-side-landing",
    "whittling-mod-level",
    "fractured-not-removed",
]

[[start]]
rarity = ["rare"]
closable_side = true

[[start]]
rarity = ["rare"]
one_side_open = true

# A side with fewer free slots than missing targets loses a non-target first.
[[step]]
id = "remove"
say = "Whittle the blocker when that is certain, else annul it (Sinistral or Dextral Annulment when the other side holds a target)"
goal = "remove-unwanted"
side = "blocked"

[[step.action]]
currency = "chaos-orb"
omens = ["omen-of-whittling"]

[[step.action]]
currency = "orb-of-annulment"
omens = ["side-omen"]

[[step.action]]
currency = "orb-of-annulment"

# Filler is filler: the cheapest exalt first.
[[step]]
id = "close"
say = "Close the finished side: an Exalted Orb with its side omen, and Greater Exaltation where two slots are free"
goal = "fill"
side = "close"

[[step.action]]
currency = "exalted-orb"
omens = ["greater-omen", "side-omen"]

[[step.action]]
currency = "greater-exalted-orb"
omens = ["greater-omen", "side-omen"]

[[step.action]]
currency = "perfect-exalted-orb"
omens = ["greater-omen", "side-omen"]

# With one side open an exalt can land nowhere else.
[[step]]
id = "slam-open-side"
say = "Exalt the one open side; no side omen is needed"
goal = "add-wanted"
side = "target"
guard = { one_side_open = true }

[[step.action]]
currency = "perfect-exalted-orb"
omens = ["greater-omen"]

[[step.action]]
currency = "greater-exalted-orb"
omens = ["greater-omen"]

[[step.action]]
currency = "exalted-orb"
omens = ["greater-omen"]

[[step]]
id = "side-slam"
say = "Exalt for a target on its side (Sinistral or Dextral Exaltation)"
goal = "add-wanted"
side = "target"

[[step.action]]
currency = "perfect-exalted-orb"
omens = ["greater-omen", "side-omen"]

[[step.action]]
currency = "greater-exalted-orb"
omens = ["greater-omen", "side-omen"]

[[step.action]]
currency = "exalted-orb"
omens = ["greater-omen", "side-omen"]
