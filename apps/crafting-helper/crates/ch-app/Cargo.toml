[package]
name = "ch-app"
description = "The crafting helper's logic with no Tauri dependency: the store, the grab of an item's text on demand, the hotkey rules, the saved settings, the overlay's state, the view and the update check and install, tested with a fake shell and a fake transport."
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# The update logic the apps share (apps/shared, a workspace of its own):
# no network and no unsafe code; the glue hands it the transport.
ep-update = { path = "../../../shared/crates/ep-update" }
# The crafting engine, re-exported for the craft window (and through it the
# data, the blueprints and the item parser).
ch-engine = { path = "../ch-engine" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
