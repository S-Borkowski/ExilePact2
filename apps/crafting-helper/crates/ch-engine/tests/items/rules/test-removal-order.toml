# A state-ordered test blueprint (engine tests only): a slam listed before
# the clean-up, so that Certain removals first decides which comes first.
id = "test-removal-order"
name = "Test: slam, then clean a blocked side"
classes = ["Rings"]
source = "ch-engine tests"
order = "state"
relies_on = ["greater-with-side-omen", "greater-needs-two-free"]

[[start]]
rarity = ["rare"]

[[step]]
id = "side-slam"
say = "Exalt for a target on its side (Sinistral or Dextral Exaltation)"
goal = "add-wanted"
side = "target"

[[step.action]]
currency = "perfect-exalted-orb"
omens = ["greater-omen", "side-omen"]

[[step]]
id = "remove"
say = "Annul the blocker (Sinistral or Dextral Annulment when the other side holds a target)"
goal = "remove-unwanted"
side = "blocked"

[[step.action]]
currency = "orb-of-annulment"
omens = ["side-omen"]

[[step.action]]
currency = "orb-of-annulment"
