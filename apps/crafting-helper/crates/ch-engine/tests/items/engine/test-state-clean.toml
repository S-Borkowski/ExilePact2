# A state-ordered test blueprint (engine tests only), in the shape of
# rare-clean-then-slam: clean a blocked side, then slam a target's side.
id = "test-state-clean"
name = "Test: clean, then slam a target's side"
classes = ["Rings"]
source = "ch-engine tests"
order = "state"
relies_on = ["greater-with-side-omen", "greater-needs-two-free", "whittling-mod-level"]

[[start]]
rarity = ["rare"]

[[step]]
id = "remove"
say = "Whittle the blocker when that is certain, else annul it (Sinistral or Dextral Annulment when the other side holds a target)"
goal = "remove-unwanted"
side = "blocked"

[[step.action]]
currency = "chaos-orb"
omens = ["omen-of-whittling"]

[[step.action]]
currency = "orb-of-annulment"
omens = ["side-omen"]

[[step.action]]
currency = "orb-of-annulment"

[[step]]
id = "side-slam"
say = "Exalt for a target on its side (Sinistral or Dextral Exaltation)"
goal = "add-wanted"
side = "target"

[[step.action]]
currency = "perfect-exalted-orb"
omens = ["greater-omen", "side-omen"]
