# A state-ordered test blueprint (engine tests only), in the shape of
# close-a-side: clean a blocked side, close the side whose targets are all
# on the item, slam the one open side, else slam a target's side.
id = "test-state-close"
name = "Test: close a side, then slam the open one"
classes = ["Rings"]
source = "ch-engine tests"
order = "state"
relies_on = [
    "greater-with-side-omen",
    "greater-needs-two-free",
    "open-side-landing",
    "whittling-mod-level",
    "fractured-not-removed",
]

[[start]]
rarity = ["rare"]
closable_side = true

[[start]]
rarity = ["rare"]
one_side_open = true

[[step]]
id = "remove"
say = "Whittle the blocker when that is certain, else annul it (Sinistral or Dextral Annulment when the other side holds a target)"
goal = "remove-unwanted"
side = "blocked"

[[step.action]]
currency = "chaos-orb"
omens = ["omen-of-whittling"]

[[step.action]]
currency = "orb-of-annulment"
omens = ["side-omen"]

[[step.action]]
currency = "orb-of-annulment"

[[step]]
id = "close"
say = "Close the side: an Exalted Orb with its side omen, and Greater Exaltation where two slots are free"
goal = "fill"
side = "close"

[[step.action]]
currency = "exalted-orb"
omens = ["greater-omen", "side-omen"]

[[step.action]]
currency = "greater-exalted-orb"
omens = ["greater-omen", "side-omen"]

[[step]]
id = "slam-open-side"
say = "Exalt the one open side"
goal = "add-wanted"
side = "target"
guard = { one_side_open = true }

[[step.action]]
currency = "perfect-exalted-orb"
omens = ["greater-omen"]

[[step.action]]
currency = "exalted-orb"
omens = ["greater-omen"]

[[step]]
id = "side-slam"
say = "Exalt for a target on its side (Sinistral or Dextral Exaltation)"
goal = "add-wanted"
side = "target"

[[step.action]]
currency = "perfect-exalted-orb"
omens = ["greater-omen", "side-omen"]

[[step.action]]
currency = "exalted-orb"
omens = ["greater-omen", "side-omen"]
