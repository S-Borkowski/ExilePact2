 275) scale(1.6666666666666667)"><path d="M12 2 22 12 12 22 2 12Z" fill="none" stroke="#D0BF94" stroke-width="1.4" /><path d="M12 5 19 12 12 19 5 12Z" fill="none" stroke="#D0BF94" stroke-width=".8"/></g><text x="339" y="292" font-size="15" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Available</text><text x="339" y="313" font-size="12" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Available</text><g transform="translate(517 275) scale(1.6666666666666667)"><path d="M12 2 22 12 12 22 2 12Z" fill="none" stroke="#69747C" stroke-width="1.4" /></g><text x="570" y="292" font-size="15" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Not yet available</text><text x="570" y="313" font-size="12" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Locked</text><g transform="translate(748 275) scale(1.6666666666666667)"><path d="M12 2 22 12 12 22 2 12Z" fill="#818D95" stroke="#B8C0C5" stroke-width="1.4" /><path d="M12 5 19 12 12 19 5 12Z" fill="none" stroke="#D2D7DA" stroke-width=".8"/></g><text x="801" y="292" font-size="15" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Completed</text><text x="801" y="313" font-size="12" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Done</text><g transform="translate(979 275) scale(1.6666666666666667)"><path d="M12 2 22 12 12 22 2 12Z" fill="none" stroke="#8D979E" stroke-width="1.4" /><defs><clipPath id="skip-clip"><path d="M12 3 21 12 12 21 3 12Z"/></clipPath></defs><g clip-path="url(#skip-clip)" stroke="#9AA5AC" stroke-width="1"><path d="M-24 0l24 24"/><path d="M-20 0l24 24"/><path d="M-16 0l24 24"/><path d="M-12 0l24 24"/><path d="M-8 0l24 24"/><path d="M-4 0l24 24"/><path d="M0 0l24 24"/><path d="M4 0l24 24"/><path d="M8 0l24 24"/><path d="M12 0l24 24"/><path d="M16 0l24 24"/><path d="M20 0l24 24"/><path d="M24 0l24 24"/></g></g><text x="1032" y="292" font-size="15" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Skip