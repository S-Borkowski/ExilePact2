x="1" y="1" width="135" height="32" rx="0" fill="#10191F" stroke="#8D979E"/><rect x="3" y="3" width="78" height="28" rx="0" fill="#424D54" stroke="none"/><text x="42" y="22" font-size="14" fill="#E4E6E7" class="" text-anchor="middle" style="fill:#E4E6E7">Next up</text><text x="108" y="22" font-size="14" fill="#E4E6E7" class="" text-anchor="middle" style="fill:#E4E6E7">All</text></g><g transform="translate(450 595)"><path d="M0 12H190" fill="none" stroke="#8D979E" stroke-width="4"/><circle cx="113" cy="12" r="7" fill="#B8C0C5"/></g><text x="690" y="616" font-size="14" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">8 px scrollbars · 2 px ivory focus outline</text><text x="48" y="687" font-size="18" fill="#E4E6E7" class="caps" text-anchor="start" style="fill:#E4E6E7">Supporting parts</text><g transform="translate(50 716)"><rect x="0" y="0" width="300" height="54" rx="0" fill="#121B20" stroke="none"/><rect x="0" y="0" width="2" height="54" rx="0" fill="#8D979E" stroke="none"/><text x="14" y="23" font-size="15" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Waiting for character…</text><text x="14" y="43" font-size="12" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Enter a character to continue.</text></g><g transform="translate(490 716)"><rect x="0" y="0" width="300" height="54" rx="0" fill="#121B20" stroke="none"/><rect x="0" y="0" width="2" height="54" rx="0" fill="#CAB990" stroke="none"/><text x="14" y="23" font-size="15" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Log is not readable</text><text x="14" y="43" font-size="12" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Choose Client.txt in Settings.</text></g><g transform="translate(930 716)"><rect x="0" y="0" width="300" height="54" rx="0" fill="#121B20" stroke="none"/><rect x="0" y="0" width="2" height="54" rx="0" fill="#D0A3A0" stroke="none"/><text x="14" y="23" font-size="15" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Settings could not be saved</text><text x="14" y="43" font-size="12" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Try the setting again.</text></g><g transform="translate(50 809)"><path d="M0 5H450" fill="none" stroke="#353E44" stroke-width="3"/><path d="M0 4H450" fill="none" stroke="#879197" stroke-width="1"/><path d="M225.0 0l5 5-5 5-5-5Z" fill="#20282D" stroke="#A6AEB3"/></g><text x="50" y="848" font-size="14" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Thin steel divider, central diamond; no boxed quest rows.</text><g transform="translate(570 796)"><rect x="1" y="1" width="250" height="42" rx="0" fill="#141D23" stroke="#8D979E"/><text x="14" y="28" font-size="14" fill="#D0BF94" class="caps" text-anchor="start" style="fill:#D0BF94">Quest Tracker</text><text x="239" y="28" font-size="15" fill="#E4E6E7" class="" text-anchor="end" style="fill:#E4E6E7">3</text></g><text x="570" y="868" font-size="13" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Collapsed badge retains existing count/warning behavior.</text><text x="48" y="932" font-size="18" fill="#E4E6E7" class="caps" text-anchor="start" style="fill:#E4E6E7">Frame and safe areas</text><text x="48" y="970" font-size="16" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Source: 1189 × 1323 RGBA · nine-slice: 224 px each side · destination corners: 48 px</text><text x="48" y="998" font-size="15" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Outset: 8 px within the existing 12 px transparent native-window margin. Never fill the centre slice.</text><text x="48" y="1038" font-size="15" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Whole-scroll fallback: start with 44 px top/bottom clearance; measure actual artwork, not just a rectangle.</text><text x="48" y="1065" font-size="15" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Fixed header/footer: centred labels clear the corner zones. Keep a fixed edit/settings drag strip reachable.</text><text x="48" y="1141" font-size="18" fill="#E4E6E7" class="caps" text-anchor="start" style="fill:#E4E6E7">Text fields / validation</text><rect x="50" y="1174" width="280" height="36" rx="0" fill="#151E24" stroke="#8D979E"/><text x="61" y="1198" font-size="14" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Ctrl + Alt + Q</text><text x="50" y="1234" font-size="13" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">default</text><rect x="380" y="1174" width="280" height="36" rx="0" fill="#151E24" stroke="#E6E5DE"/><text x="391" y="1198" font-size="14" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Ctrl + Alt + Q</text><text x="380" y="1234" font-size="13" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">focus</text><rect x="710" y="1174" width="280" height="36" rx="0" fill="#151E24" stroke="#D0A3A0"/><text x="721" y="1198" font-size="14" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Ctrl + Alt + Q</text><text x="710" y="1234" font-size="13" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">invalid</text><rect x="1040" y="1174" width="280" height="36" rx="0" fill="#151E24" stroke="#535D64"/><text x="1051" y="1198" font-size="14" fill="#535D64" class="" text-anchor="start" style="fill:#535D64">Ctrl + Alt + Q</text><text x="1040" y="1234" font-size="13" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">disabled</text><text x="48" y="1312" font-size="17" fill="#E4E6E7" class="serif" text-anchor="start" style="fill:#E4E6E7">Reuse the supplied icon/font library. No additional art generation is required.</text></svg>