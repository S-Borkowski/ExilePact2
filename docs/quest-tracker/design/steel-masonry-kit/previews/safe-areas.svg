 224" preserveAspectRatio="none"><use href="#kit-frame"/></svg><svg x="256" y="176" width="48" height="48" viewBox="965 1099 224 224" preserveAspectRatio="none"><use href="#kit-frame"/></svg></g><text x="354" y="103" font-size="15" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Minimum native window: 320 × 240</text><text x="354" y="130" font-size="14" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Painted panel: 296 × 216</text><text x="354" y="166" font-size="15" fill="#E4E6E7" class="" text-anchor="start" style="fill:#E4E6E7">Keep a 44 px top / bottom safe strip.</text><text x="354" y="194" font-size="14" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Scroll the content inside this well.</text><text x="354" y="232" font-size="14" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Fixed drag strip stays outside the scroll.</text><text x="32" y="333" font-size="14" fill="#A9AFB3" class="" text-anchor="start" style="fill:#A9AFB3">Candidate geometry for later wiring; verify actual ornament intersections at every supported scale.</text></svg>